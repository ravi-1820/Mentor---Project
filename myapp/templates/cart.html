
{% extends 'header.html' %}
{% load static %}
{% block content %}


<div class="container my-5">
 <h2 class="text-center mb-4">Shopping Cart</h2>
 {% for i in cart %}
 <div class="row">
   <!-- Product List -->
   <div class="col-md-8">
     <div class="card mb-3">
       <div class="row g-0">
         <div class="col-md-4">
           <img src="{{i.courses.cimage.url}}" class="img-fluid rounded-start" alt="Product Image">
         </div>
         <div class="col-md-8">
           <div class="card-body">
             <h5 class="card-title">{{i.courses.cname}}</h5>
             <p class="card-text">{{i.courses.desc}}</p>
             <p class="card-text"><strong>{{i.courses.cprice}}</strong></p>
             <div class="d-flex align-items-center">
               
               <a href="{% url 'deletecart' pk=i.courses.pk %}"><button class="btn btn-danger btn-sm">DELETE</button></a>
             </div>
           </div>
         </div>
       </div>
     </div>
     {% endfor %}
   </div>
   <!-- Summary Section -->
   <div class="col-md-4">
     <div class="card">
       <div class="card-body">
         <h5 class="card-title">Order Summary</h5>
         <p>Subtotal: {{net}}</p>
        
         <hr>
         <p><strong>Total: {{net}}</strong></p>
         <button class="btn btn-primary w-100" id="rzp-button1">Checkout</button>
       </div>
     </div>
   </div>
 </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Footer Start -->
 <script>
        var options = {
            "key": "rzp_test_3iCOPLbchUyIwQ", // Enter the Key ID generated from the Dashboard
            "amount": "{{ payment.amount|default:'0' }}", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
            "currency": "INR",
            "name": "Mentor",
            "description": "Test Payment", // This is a sample Order ID. Pass the id obtained in the response of Step 1
            "handler": function (response) {
                console.log(response);
                window.location.href = `http://127.0.0.1:8000/success?razorpay_payment_id=${response.razorpay_payment_id}`;
            },
            "theme": {
                "color": "#94CA21"
            }
        };
        var rzp1 = new Razorpay(options);
        rzp1.on('payment.failed', function (response) {
            alert(response.error.code);
            alert(response.error.description);
            alert(response.error.source);
            alert(response.error.step);
            alert(response.error.reason);
            alert(response.error.metadata.order_id);
            alert(response.error.metadata.payment_id);
        });
        document.getElementById('rzp-button1').onclick = function (e) {
            rzp1.open();
            e.preventDefault();
        }
    </script>

{% endblock %}
